<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#be123c">
<title>Ngoại tuyến — Ngày Lễ Việt</title>
<style>
  :root { color-scheme: light dark; }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; display: grid; place-items: center;
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    background: #fffdf8; color: #1c1917; text-align: center; padding: 2rem;
  }
  @media (prefers-color-scheme: dark) {
    body { background: #171412; color: #f5f0e8; }
  }
  .mark { font-size: 3rem; line-height: 1; }
  h1 { font-size: 1.6rem; margin: 1rem 0 .5rem; }
  p { color: #78716c; max-width: 30rem; margin: .25rem auto; }
  a {
    display: inline-block; margin-top: 1.25rem; padding: .7rem 1.6rem;
    border-radius: 999px; background: #be123c; color: #fff;
    text-decoration: none; font-weight: 700;
  }
</style>
</head>
<body>
<main>
  <div class="mark" aria-hidden="true">🌸</div>
  <h1>Bạn đang ngoại tuyến</h1>
  <p>Trang này chưa được lưu để xem offline. Các trang bạn đã ghé thăm vẫn mở được bình thường.</p>
  <p><i>You are offline. Pages you visited before are still available.</i></p>
  <a href="javascript:history.back()">← Quay lại</a>
</main>
</body>
</html>
