version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      next:
        patterns:
          - "next"
          - "eslint-config-next"
      test:
        patterns:
          - "vitest"
          - "@playwright/test"
          - "@axe-core/playwright"
          - "axe-core"
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
